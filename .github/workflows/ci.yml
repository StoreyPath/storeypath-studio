name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync && uv run pytest -q
        working-directory: studio
      - name: Viewer modules parse
        run: for f in viewer/src/*.js viewer/src/world/*.js viewer/examples/*/app.js; do node --check "$f"; done

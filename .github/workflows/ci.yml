name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      # the tests make a database of their own on it for each test (studio/tests/conftest.py)
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: storeypath
          POSTGRES_PASSWORD: storeypath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U storeypath" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STOREYPATH_TEST_DATABASE_URL: postgresql://storeypath:storeypath@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true  # StoreyPath Viewer: the format and the viewers
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The 2D plan, built as Studio serves it
        run: npm ci && npm run build
        working-directory: storeypath-viewer/viewer/svg
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra vision && uv run pytest -q
        working-directory: studio

# StoreyPath Studio with Docker Compose, and the GPU helper beside it on a machine
# with an NVIDIA GPU.
#
#   docker compose -f docker/compose.yml up -d                  # Studio alone
#   docker compose -f docker/compose.yml --profile gpu up -d    # and the GPU helper
#
# Studio is then at https://localhost:8080 (admin / admin the first time). All it keeps,
# its database too, is in one volume, `storeypath`: the same one `docker run -v
# storeypath:/data` uses. The helper needs a key, which Studio sends it: put one in
# docker/.env, once (that file is not committed):
#
#   echo "STOREYPATH_HELPER_KEY=$(openssl rand -hex 32)" > docker/.env
#
# Studio asks the helper at http://gpu-helper:8105/v1, on the compose network alone
# (the helper's port is not published); without the gpu profile it says the helper
# does not answer, and works without vision. More settings, in docker/.env too:
# STOREYPATH_PORT (8080), STOREYPATH_BIND (127.0.0.1; 0.0.0.0 for others on your
# network), STOREYPATH_ALLOWED_HOSTS, STOREYPATH_HELPER_SLOTS (questions the helper
# answers at once: 2 for the llama.cpp image, 16 for the vLLM one), STOREYPATH_HELPER_GPU_MEMORY
# (the vLLM image: GB of the card it takes, 44 by default, or auto: what is free when it starts), STOREYPATH_VISION_URL (other
# helpers, or more: comma-separated), STOREYPATH_VOLUME, STOREYPATH_IMAGE and
# STOREYPATH_HELPER_IMAGE.
#
# The studio image is published (ghcr.io/storeypath/studio); the helper is built from
# its own repository, https://github.com/StoreyPath/storeypath-gpu-helper: storeypath/gpu-helper:vllm (vLLM,
# about four times faster; NVIDIA driver 575 or newer, or 535 or newer on a data-center GPU),
# the one to take where the driver allows (STOREYPATH_HELPER_IMAGE=storeypath/gpu-helper:vllm
# and STOREYPATH_HELPER_SLOTS=16), or storeypath/gpu-helper (llama.cpp, any driver from 525).

name: storeypath

services:
  studio:
    image: ${STOREYPATH_IMAGE:-ghcr.io/storeypath/studio}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${STOREYPATH_BIND:-127.0.0.1}:${STOREYPATH_PORT:-8080}:8080"
    volumes:
      - storeypath:/data
    environment:
      STOREYPATH_ALLOWED_HOSTS: ${STOREYPATH_ALLOWED_HOSTS:-}
      STOREYPATH_VISION_URL: ${STOREYPATH_VISION_URL:-http://gpu-helper:8105/v1}
      STOREYPATH_VISION_KEY: ${STOREYPATH_HELPER_KEY:-}
      STOREYPATH_VISION_PARALLEL: ${STOREYPATH_HELPER_SLOTS:-2}
    # Studio stops first, then its database: give them the time
    stop_grace_period: 1m
    restart: unless-stopped

  gpu-helper:
    profiles: [gpu]
    image: ${STOREYPATH_HELPER_IMAGE:-storeypath/gpu-helper}
    environment:
      STOREYPATH_HELPER_KEY: ${STOREYPATH_HELPER_KEY:-}
      STOREYPATH_HELPER_SLOTS: ${STOREYPATH_HELPER_SLOTS:-2}
      STOREYPATH_HELPER_GPU_MEMORY: ${STOREYPATH_HELPER_GPU_MEMORY:-}
    expose:
      - "8105"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  storeypath:
    name: ${STOREYPATH_VOLUME:-storeypath}

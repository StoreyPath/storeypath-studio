[project]
name = "storeypath"
version = "0.1.0"
description = "StoreyPath Studio: convert DWG/DXF floor plans into portable indoor map packages with stable object IDs"
readme = "README.md"
authors = [
    { name = "Khalefa", email = "storeypath@alahmad.org" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "cryptography>=43",
    "ezdxf>=1.4.4",
    "pydantic>=2",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "shapely>=2.1.2",
    "typer>=0.27.2",
]

[project.optional-dependencies]
# SymPoint-V2 for spotting the symbols drawn in plans, for research only: see
# src/storeypath/symbols/__init__.py. Its code and weights are fetched separately.
symbols = [
    "munch>=4",
    "scipy>=1.13",
    "torch>=2.4",
]

# Looking at the plans with a vision model (vision.py): rendering the drawing.
vision = [
    "matplotlib>=3.9",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/StoreyPath/storeypath"
Source = "https://github.com/StoreyPath/storeypath/tree/main/studio"

[project.scripts]
storeypath = "storeypath.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storeypath"]
artifacts = ["src/storeypath/_bundled"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/storeypath/_bundled"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# PyTorch without the GPU libraries: SymPoint-V2 runs on the CPU here
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

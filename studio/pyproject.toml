[project]
name = "storeypath"
version = "0.1.0"
description = "StoreyPath Studio: convert DWG/DXF floor plans into portable indoor map packages with stable object IDs"
readme = "README.md"
authors = [
    { name = "Khalefa", email = "storeypath@alahmad.org" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "ezdxf>=1.4.4",
    "pydantic>=2",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "shapely>=2.1.2",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/StoreyPath/storeypath"
Source = "https://github.com/StoreyPath/storeypath/tree/main/studio"

[project.scripts]
storeypath = "storeypath.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storeypath"]
artifacts = ["src/storeypath/_bundled"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/storeypath/_bundled"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoreyPath Navigate</title>
  <link rel="icon" href="data:,">
  <script>
    try { if (localStorage.getItem("storeypath.theme") === "light") document.documentElement.dataset.theme = "light"; } catch {}
  </script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="style.css">
  <!-- the plan engine's look (viewer/svg, built: npm run build); without it the steps still show -->
  <link rel="stylesheet" href="/viewer/svg/dist/plan.css">
  <link rel="stylesheet" href="navigate.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/viewer/vendor/three/three.module.js",
        "three/addons/": "/viewer/vendor/three/addons/",
        "jszip": "/viewer/vendor/jszip.mjs"
      }
    }
  </script>
</head>
<body class="navigate">
  <header class="topbar">
    <div class="tb-start">
      <a class="tb-home" href="/" aria-label="StoreyPath Studio: all projects" data-tip="All projects">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide.svg#layers"/></svg>
      </a>
      <nav class="crumbs" aria-label="Where you are">
        <a class="crumb" href="/">Projects</a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <a id="back" class="crumb" href="/" data-tip="The project's page">Project</a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span class="crumb crumb-here" aria-current="page">Find the way</span>
      </nav>
    </div>
    <div class="tb-end">
      <button id="theme-toggle" type="button" class="btn-ghost btn-icon theme-toggle" aria-label="Light or dark" data-tip="Light or dark">
        <svg class="icon icon-dark" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide.svg#moon"/></svg>
        <svg class="icon icon-light" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide.svg#sun"/></svg>
      </button>
      <div id="account" class="tb-account"></div>
    </div>
  </header>

  <div class="nav-main">
  <aside id="panel">
    <header class="nav-head">
      <h1><svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide.svg#route"/></svg> Find the way</h1>
      <div id="project-meta" class="meta"></div>
    </header>

    <label class="field nav-building" id="building-field">Building
      <select id="building"></select>
    </label>

    <section class="trip" aria-label="From where to where">
      <div class="trip-rail" aria-hidden="true">
        <span class="trip-dot trip-from"></span>
        <span class="trip-dots"></span>
        <svg class="icon trip-to" width="16" height="16" viewBox="0 0 24 24"><use href="/icons/lucide.svg#map-pin"/></svg>
      </div>
      <div class="trip-fields">
        <div class="picker" id="from">
          <label class="sr-only" for="from-input">From: a kiosk, an entrance or any room</label>
          <input id="from-input" type="search" autocomplete="off" placeholder="From: a kiosk, an entrance or a room"
                 role="combobox" aria-expanded="false" aria-controls="from-list" aria-autocomplete="list">
          <ul id="from-list" class="choices" role="listbox" hidden></ul>
        </div>
        <div class="picker" id="to">
          <label class="sr-only" for="to-input">To: a room, by name or number</label>
          <input id="to-input" type="search" autocomplete="off" placeholder="To: a room, by name or number"
                 role="combobox" aria-expanded="false" aria-controls="to-list" aria-autocomplete="list">
          <ul id="to-list" class="choices" role="listbox" hidden></ul>
        </div>
      </div>
      <button id="swap" type="button" class="btn-ghost btn-icon swap" data-tip="Swap from and to" aria-label="Swap from and to">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide.svg#arrow-up-down"/></svg>
      </button>
    </section>

    <label class="switch step-free" data-tip="Lifts and ramps only: no stairs or escalators">
      <span class="step-free-text">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide.svg#accessibility"/></svg>
        Step-free <span class="hint">lifts and ramps, no stairs</span>
      </span>
      <input type="checkbox" id="accessible">
    </label>

    <section id="result" hidden aria-live="polite">
      <div class="summary">
        <div class="sum-top">
          <div class="sum-figures">
            <span class="sum-metres" id="sum-metres"></span>
            <span class="sum-time" id="sum-time"></span>
          </div>
          <div class="sum-actions">
            <button id="restart" type="button" class="btn-ghost btn-icon" aria-label="Play from the start" data-tip="From the start" hidden>
              <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide.svg#rotate-ccw"/></svg>
            </button>
            <button id="play" type="button" class="btn-primary play" aria-pressed="false" data-tip="Walk the way: a dot along it, floor by floor">
              <svg class="icon icon-play" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide.svg#play"/></svg>
              <svg class="icon icon-pause" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide.svg#pause"/></svg>
              <span class="play-label">Play</span>
            </button>
          </div>
        </div>
        <div class="sum-sub" id="sum-sub"></div>
        <div class="progress" id="progress" aria-hidden="true"><span></span></div>
      </div>
      <ol id="steps" aria-label="Directions: up and down arrows go through them"></ol>
      <p class="keys-hint"><kbd>↑</kbd><kbd>↓</kbd> go through the steps</p>
    </section>
    <p id="message" class="meta" role="status"></p>
  </aside>

  <main id="views">
    <div id="bar">
      <div class="segmented" id="view-mode" role="group" aria-label="View">
        <button type="button" data-view="plan" class="active" title="Each floor's plan, with the way on it">Plan</button>
        <button type="button" data-view="3d" title="The building in 3D, with the way through it">3D</button>
        <button type="button" data-view="both" title="The plan and the 3D view side by side">Both</button>
      </div>
      <nav id="floors" aria-label="Floors"></nav>
      <span class="grow"></span>
      <button id="fit" type="button" class="btn-ghost only-plan" title="The way on this floor; press again for the whole floor">
        <svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide.svg#maximize"/></svg> Fit
      </button>
      <span class="look only-3d" title="How the 3D view is drawn: Real, floors finished by what each room is, plaster walls and soft shadows; Model, white, like an architect's model, its edges drawn">Look
        <span class="segmented" id="look" role="group" aria-label="Look">
          <button type="button" data-style="real">Real</button>
          <button type="button" data-style="model">Model</button>
        </span>
      </span>
      <label class="look only-3d" title="High: soft shadows where surfaces meet, smooth edges. Low: quickest, for built-in, virtual or software graphics. Auto: Low on those, or when High draws slowly; else High">Quality
        <select id="quality">
          <option value="auto">Auto</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
      </label>
      <button id="fly" type="button" class="only-3d" title="Take the 3D view along the way" disabled>
        <svg class="icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/lucide.svg#navigation-2"/></svg> Fly along
      </button>
    </div>
    <div id="panes" class="plan">
      <div id="plan-pane" class="pane">
        <div id="plan"></div>
        <p id="plan-note" class="note" hidden></p>
      </div>
      <div id="world-pane" class="pane">
        <div id="world3d"></div>
        <div id="world-floors" class="floor-stack" role="group" aria-label="Floors in 3D" hidden></div>
        <p id="world-note" class="note" hidden></p>
      </div>
    </div>
  </main>

  </div>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="navigate.js"></script>
</body>
</html>

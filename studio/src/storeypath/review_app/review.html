<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoreyPath Review</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <header>
      <a id="back" class="back" href="/">← Projects</a>
      <h1 id="project-name">StoreyPath Review</h1>
      <div id="project-meta" class="meta"></div>
    </header>

    <section>
      <label class="field">Floor
        <select id="floor"></select>
      </label>
      <div id="floor-meta" class="meta"></div>
      <div class="row">
        <button id="convert" type="button" title="Read the floor's drawing again; IDs and corrections are kept">Re-read drawing</button>
        <a id="walk3d" class="button" target="_blank" title="This floor in 3D, as it is now: orbit it or walk through it">Walk in 3D</a>
        <a id="open-print" class="button" target="_blank" title="The floor's drawing as printed, full size, in a new tab">Open print</a>
      </div>
      <details id="warnings" hidden>
        <summary></summary>
        <ul></ul>
      </details>
    </section>

    <section id="editor" hidden>
      <div class="editor-head">
        <h3 id="ed-title"></h3>
        <button id="ed-close" type="button" class="icon" title="Close (Esc)" aria-label="Close">×</button>
      </div>
      <div class="id-row"><code id="ed-id"></code><button id="ed-copy" type="button">Copy</button></div>
      <ul id="ed-reasons" class="reasons"></ul>
      <form id="ed-form" autocomplete="off">
        <label class="field">Type
          <select id="ed-type"></select>
          <span class="detected" id="ed-type-detected"></span>
        </label>
        <label class="field">Name
          <input id="ed-name" type="text" placeholder="no name">
          <span class="detected" id="ed-name-detected"></span>
        </label>
        <label class="field">Number
          <input id="ed-number" type="text" placeholder="no number">
          <span class="detected" id="ed-number-detected"></span>
        </label>
        <div class="meta" id="ed-area"></div>
        <div class="row">
          <button id="ed-save" type="submit" class="primary">Save</button>
          <button id="ed-reset" type="button" title="Remove the corrections and use what was detected">Use detected</button>
        </div>
        <div class="row flags">
          <button id="ed-delete" type="button" title="Not there, or not worth anything (a sliver, the outside): out of the plan, the lists and the 3D view; kept with its ID, and back with Show deleted">Delete</button>
          <span id="ed-flags" class="meta"></span>
        </div>
      </form>
    </section>

    <section id="item-editor" hidden>
      <div class="editor-head">
        <h3 id="it-title"></h3>
        <button id="it-close" type="button" class="icon" title="Close (Esc)" aria-label="Close">×</button>
      </div>
      <div class="id-row"><code id="it-id"></code></div>
      <div id="it-meta" class="meta"></div>
      <div class="row flags">
        <button id="it-delete" type="button">Delete</button>
        <span id="it-flags" class="meta"></span>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>To review <span id="review-count" class="count"></span></h2>
        <button id="next" type="button" title="Next space to review (N)">Next ›</button>
      </div>
      <ul id="review-list" class="list"></ul>
      <p id="review-done" class="meta" hidden>Nothing left to review on this floor.</p>
    </section>

    <section>
      <h2>All spaces <span id="space-count" class="count"></span></h2>
      <input id="search" type="search" placeholder="Filter by name, number, type or ID">
      <ul id="space-list" class="list"></ul>
    </section>

    <section>
      <h2>Space types</h2>
      <ul id="legend" class="legend"></ul>
    </section>
  </aside>

  <main id="map">
    <svg id="svg-print" class="pane" aria-label="The floor's drawing as printed" hidden>
      <g id="world-print">
        <g id="print-copy"></g>
        <path id="print-selected"></path>
        <g id="preview-print" class="preview"></g>
      </g>
      <g id="cursor-print" class="cursor"></g>
    </svg>
    <svg id="svg" class="pane" tabindex="0" aria-label="Floor plan">
      <g id="world">
        <g id="print"></g>
        <g id="drawing"></g>
        <path id="outline"></path>
        <g id="spaces"></g>
        <g id="doors"></g>
        <g id="drawn"></g>
        <g id="preview" class="preview"></g>
      </g>
      <g id="labels"></g>
      <g id="cursor-main" class="cursor"></g>
    </svg>
    <div id="toolbar">
      <button id="fit" type="button" title="Show the whole floor (F)">Fit</button>
      <label title="The drawing as printed on the left, Studio's spaces on the right, moving together"><input type="checkbox" id="side-by-side"> Side by side</label>
      <label id="drawing-label" title="The floor's drawing under the spaces: as printed, or its lines">Drawing
        <select id="drawing-mode">
          <option value="print">as printed</option>
          <option value="lines">lines</option>
          <option value="off">off</option>
        </select>
      </label>
      <label><input type="checkbox" id="show-labels" checked> Labels</label>
      <label title="Show what was deleted (and hidden), to bring it back"><input type="checkbox" id="show-hidden"> Show deleted</label>
      <span class="tools" title="Draw what the drawing leaves out: kept through every re-read">
        <button id="tool-wall" type="button" data-tool="wall" title="Draw a wall: click where it starts and where it ends (W)">Wall</button>
        <button id="tool-door" type="button" data-tool="door" title="Add a door: click on a wall (D)">Door</button>
        <button id="tool-window" type="button" data-tool="window" title="Add a window: click on a wall">Window</button>
        <button id="tool-opening" type="button" data-tool="opening" title="Add an opening, a way through with no door: click on a wall (O)">Opening</button>
        <button id="tool-divide" type="button" data-tool="divide" title="Divide a space with no wall (its zones, each named and used on its own): click the line's two ends across it (V)">Divide</button>
        <label id="tool-width-label" hidden>width <input id="tool-width" type="number" min="0.3" max="6" step="0.05" value="0.9"> m</label>
      </span>
      <span id="status" class="meta"></span>
    </div>
  </main>

  <div id="toast" hidden></div>

  <script type="module" src="review.js"></script>
</body>
</html>

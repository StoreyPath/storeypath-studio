<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoreyPath Viewer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../vendor/maplibre-gl.css">
  <link rel="stylesheet" href="../../src/viewer.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "maplibre-gl": "../../vendor/maplibre-gl.mjs",
        "jszip": "../../vendor/jszip.mjs"
      }
    }
  </script>
</head>
<body>
  <aside id="panel">
    <header>
      <h1 id="project-name">StoreyPath</h1>
      <div id="project-meta" class="meta">Open an exported <code>.storeypath</code> package to begin.</div>
    </header>

    <section id="open-section">
      <label class="button">
        Open package…
        <input type="file" id="file" accept=".storeypath,.zip" hidden>
      </label>
      <span class="hint">or drop it on the map</span>
    </section>

    <section id="nav-section" hidden>
      <label class="field">Building
        <select id="building"></select>
      </label>
      <div class="field-label">Floor</div>
      <div id="floors" class="floors"></div>
    </section>

    <section id="search-section" hidden>
      <input id="search" type="search" placeholder="Find a room by name, number or ID" autocomplete="off">
      <ul id="results" class="results"></ul>
    </section>

    <section id="details" hidden></section>

    <section id="legend-section" hidden>
      <h2>Space types</h2>
      <ul id="legend" class="legend"></ul>
    </section>
  </aside>

  <main id="map"></main>

  <div id="toolbar" hidden>
    <button id="mode" type="button">Show all floors</button>
    <button id="pitch" type="button">2D</button>
    <label><input type="checkbox" id="basemap" checked> Street map</label>
    <label title="Spaces marked hidden or ignored in Studio"><input type="checkbox" id="show-hidden"> Hidden and ignored</label>
  </div>

  <div id="drop" hidden>Drop the package to open it</div>
  <div id="error" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>

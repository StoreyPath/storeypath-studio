<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoreyPath Viewer — minimal embed</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../vendor/maplibre-gl.css">
  <link rel="stylesheet" href="../../src/viewer.css">
  <style>html, body, #map { margin: 0; height: 100%; }</style>
  <script type="importmap">
    {
      "imports": {
        "maplibre-gl": "../../vendor/maplibre-gl.mjs",
        "jszip": "../../vendor/jszip.mjs"
      }
    }
  </script>
</head>
<body>
  <div id="map"></div>
  <script type="module">
    import { StoreyPathViewer } from "../../src/index.js";

    const viewer = new StoreyPathViewer("#map");
    const pkg = await viewer.open(new URLSearchParams(location.search).get("pkg") ?? "campus.storeypath");

    // Highlight every meeting room, and select the first one.
    const rooms = pkg.search("", { type: "meeting_room" });
    viewer.highlight(rooms.map((r) => r.id));
    if (rooms.length) viewer.select(rooms[0].id);

    viewer.addEventListener("select", (e) => console.log("selected", e.detail.id));
  </script>
</body>
</html>

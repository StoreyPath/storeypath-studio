<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoreyPath plan</title>
<link rel="stylesheet" href="../dist/plan.css">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; --bg: #ecebe6; --panel: #fff; --line: #ddd; --text: #1d1d1f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #26262a; --panel: #1c1c1f; --line: #3a3a40; --text: #ececef; } }
  body { margin: 0; display: grid; grid-template-rows: auto 1fr; height: 100vh; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header input[type="search"] { min-width: 12em; }
  #plan { position: relative; min-height: 0; }
  #about { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 12px; font-size: 14px; max-width: 22em; }
  #about:empty { display: none; }
</style>
</head>
<body>
<header>
  <input type="file" id="file" accept=".storeypath">
  <select id="floor" aria-label="Floor"></select>
  <input type="search" id="find" placeholder="Find a room" aria-label="Find a room">
  <button id="fit">Fit</button>
</header>
<div id="plan"><div id="about" role="status"></div></div>
<script type="module">
  // Open a .storeypath file (or ?package=<url>): its floors, a click shows a space,
  // the search box brings matching rooms out.
  import { FloorPlanEngine, floorFromPackage, readPackage } from "../dist/index.js";

  const $ = (id) => document.getElementById(id);
  const engine = new FloorPlanEngine("#plan", { title: "Floor plan" });
  let pkg = null;
  let plan = null;

  async function open(bytes) {
    pkg = await readPackage(bytes);
    $("floor").replaceChildren(...pkg.floors.map((f) => new Option(`${f.properties.building_id.split("-").pop()} · ${f.properties.name}`, f.id)));
    show(pkg.floors[0]?.id);
  }

  function show(floorId) {
    if (!floorId) return;
    plan = floorFromPackage(pkg, floorId);
    engine.setFloor(plan);
    $("about").textContent = "";
  }

  engine.addEventListener("select", (e) => {
    const s = e.detail.space;
    $("about").textContent = s ? `${[s.name, s.number].filter(Boolean).join(" ") || s.type} — ${s.id}` : "";
  });
  $("file").addEventListener("change", async (e) => e.target.files[0] && open(e.target.files[0]));
  $("floor").addEventListener("change", (e) => show(e.target.value));
  $("fit").addEventListener("click", () => engine.fit());
  $("find").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q || !plan) return engine.highlight(null);
    const found = plan.spaces.filter((s) => `${s.name ?? ""} ${s.number ?? ""} ${s.type ?? ""}`.toLowerCase().includes(q));
    engine.highlight(found.map((s) => s.id));
    if (found.length) engine.fitTo(found.map((s) => s.id));
  });

  const url = new URLSearchParams(location.search).get("package");
  if (url) fetch(url).then((r) => r.arrayBuffer()).then(open).catch((e) => ($("about").textContent = e.message));
</script>
</body>
</html>
